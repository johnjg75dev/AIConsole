name: build

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # WPF is Windows-only, so "cross-compile" means all supported Windows RIDs.
  compile:
    name: Standalone (${{ matrix.rid }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        rid: [win-x64, win-x86, win-arm64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Publish self-contained EXE
        run: python compile.py publish --rid ${{ matrix.rid }} --out dist/${{ matrix.rid }} --no-bump

      - name: Upload standalone
        uses: actions/upload-artifact@v4
        with:
          name: standalone-${{ matrix.rid }}
          path: dist/${{ matrix.rid }}/*.exe
          if-no-files-found: error

  installers:
    name: MSI installers
    needs: compile
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download standalones
        uses: actions/download-artifact@v4
        with:
          pattern: standalone-*
          path: artifacts
          merge-multiple: false

      - name: Install WiX
        run: dotnet tool install wix --tool-path .tools --version 4.0.6

      - name: Build MSI installers
        run: python compile.py installers --artifacts artifacts --out dist/installers

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: installers
          path: dist/installers/*.msi
          if-no-files-found: error

  release:
    name: Create GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [compile, installers]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release

      - name: Publish release with compiled artifacts
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: AIConsole ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            release/**/*.exe
            release/**/*.msi
